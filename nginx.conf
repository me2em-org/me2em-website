worker_processes  1;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  server {
    listen      8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1000;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml
               application/xml+rss text/javascript image/svg+xml;

    # Server endpoints are not served in this static preview — they compile
    # to a serverless function on Vercel, Netlify or Cloudflare, and are not
    # in the static output this container serves.
    #
    # A bare 404 would reach the endpoint as unparseable text. This answers
    # in a shape the client already understands.
    location ^~ /api/ {
      default_type application/json;
      add_header Cache-Control "no-store" always;
      return 501 '{"success":false,"errors":{"form":["Server endpoints are not served in this static preview. They work on a real deploy — Vercel, Netlify or Cloudflare — but not in this container."]}}';
    }

    # Astro writes a directory with an index.html per page.
    location / {
      try_files $uri $uri/ $uri/index.html =404;
    }

    # Hashed assets never change under the same name.
    location /_astro/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    error_page 404 /404.html;
    location = /404.html {
      internal;
    }
  }
}
